
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student profile | Campora</title>
    <script>
        if (location.protocol === "file:") location.replace("signin.html");
    </script>
    <link rel="stylesheet" href="campora.css">
    <link rel="stylesheet" href="campus-design.css">
    <link rel="icon" href="favicon.png" type="image/png" sizes="32x32">
</head>
<body class="profile-page-body">

    <main class="profile-page-container">
        <a class="back-to-feed-btn auth-secondary" href="/">Back to feed</a>

        <div class="profile-cover"></div>

        <section class="social-profile-header">
            <div class="social-profile-picture-wrap">
                <img id="socialProfilePicture"
                    src="/favicon.png"
                    alt="Student profile picture">
            </div>

            <div class="social-profile-details">
                <h1 id="socialProfileName">Loading profile…</h1>
                <p id="socialProfileUsername"></p>
                <p id="socialProfileBio"></p>
                <p class="social-profile-campus">
                    <span id="socialProfileCampus">Anchor University, Lagos</span>
                </p>
                <p class="social-profile-department">
                    <span id="socialProfileDepartment"></span>
                </p>
            </div>

            <button type="button" id="editSocialProfileBtn"
                class="edit-social-profile-btn" hidden>
                Edit Profile
            </button>
        </section>

        <button type="button" id="followProfileBtn" class="primary-button" hidden>Follow</button>
        <a id="messageProfileLink" class="auth-secondary" hidden>Message</a>
        <p id="profileCounts" class="campus-listing" aria-live="polite"></p>
        <p id="campus-status" role="alert" hidden></p>
        <section aria-labelledby="profile-posts-title">
            <h2 id="profile-posts-title">Posts</h2>
            <div id="publicProfilePosts"></div>
        </section>
    </main>

    <script src="/session.js"></script>
    <script src="/community-client.js"></script>
    <script src="profile.js"></script>
</body>
</html>
